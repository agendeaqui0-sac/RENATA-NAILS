<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(165deg,var(--g1),var(--g2) 45%,var(--g3)) fixed;color:var(--tx);font:16px/1.45 Poppins,system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:26px;margin:4px 0;font-weight:700}h3{font-size:16px;margin:16px 0 8px}
.hero{text-align:center;padding:14px 0 4px}.hero p{color:var(--mu);margin:0}
.hero.top{background-size:cover;background-position:center 20%;border-radius:32px;border:3px solid var(--bd);padding:290px 14px 18px;color:#fff;box-shadow:0 10px 30px rgba(236,72,153,.18)}.hero.top p{color:#fff}.hero.top h1{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}.hero.top .tags span{background:rgba(255,255,255,.22);color:#fff}.sec{background:var(--card);border:3px solid var(--bd);border-radius:32px;padding:18px;margin:16px 0;box-shadow:0 10px 30px rgba(236,72,153,.18)}

.sec h2:after{content:"";flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,#f472b6,#fb923c,#fbbf24)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--tile);color:var(--tx);border-radius:16px;padding:10px 12px;text-decoration:none;text-align:center;display:inline-block}
button.sel{background:linear-gradient(135deg,var(--pk),var(--pk2));color:var(--on);border-color:var(--pk);font-weight:600}

.pri{background:linear-gradient(135deg,var(--pk),var(--pk2));color:var(--on);border-color:var(--pk);font-weight:600;width:100%;padding:13px}
.sv{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:22px}
.sv small{color:var(--mu);font-size:12px}.sv.sel small{color:var(--on)}
.sv:last-child{grid-column:1/-1}
.sv.ft{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:12px;text-align:left;padding:16px;background:linear-gradient(135deg,#fff3c4,#ffdbe9);border-color:#fbbf24;color:#4a1a33}
.sv.ft small{display:block;color:#9a5f7d}
.sv.sel,.sv.ft.sel{background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;border-color:var(--pk)}
.sv.ft.sel small{color:#fff}
.ic{font-size:36px;line-height:1}
.pill{background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;font-weight:700;border-radius:99px;padding:4px 16px;white-space:nowrap}
.sv.sel .pill{background:#fff;color:var(--pk)}
input{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 8px}
.mu{color:var(--mu);font-size:14px;margin:0 0 10px}.ok{color:var(--ok);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
.note{background:var(--pk3);border-radius:14px;padding:10px;font-size:14px;margin:10px 0}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#fb923c);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;margin:8px auto}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}.tags span{background:var(--pk3);border-radius:99px;padding:4px 10px;font-size:13px}
.st{display:flex;gap:12px;align-items:center;margin:10px 0}.st b{background:linear-gradient(135deg,#ec4899,#fb923c);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.why{border:2px dashed var(--bd);background:var(--tile);border-radius:20px;padding:16px 8px;text-align:center}.why span{display:block;font-size:32px}
.gal{columns:2;column-gap:12px}.gal img{width:100%;display:block;border:3px solid var(--bd);border-radius:26px;margin:0 0 12px;box-shadow:0 6px 16px rgba(236,72,153,.2);break-inside:avoid;cursor:pointer;box-sizing:border-box}
.lb{position:fixed;inset:0;background:rgba(40,10,30,.85);display:grid;place-items:center;z-index:20;padding:16px}.lb img{max-width:100%;max-height:100%;border-radius:20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:10}
footer{text-align:center;margin:20px 0 8px}footer button{background:none;border:none;color:var(--mu);font-size:13px;text-decoration:underline}

function home(){
  const tm=d=>d>=60?(d/60)+"h":d+" min";
  let h=`<div class="hero top" style="background-image:linear-gradient(180deg,rgba(40,10,30,0) 50%,rgba(40,10,30,.72)),url(${HP})"><div>✨ 💖 ⭐ ✨</div><h1>Renata Julia Nails Design</h1><p>Unhas lindas, do seu jeitinho 💅</p><div class="tags"><span>💎 Alongamento</span><span>🌸 Nail Art</span><span>✨ Cuidado total</span></div><div class="row"><a class="btn" target="_blank" href="https://wa.me/${WA}">💬 WhatsApp</a><a class="btn" target="_blank" href="https://instagram.com/renata_julia282">📸 Instagram</a><button data-a="pub">📅 Ver agendamentos</button></div></div>
  ${S.off?`<div class="note">Não foi possível carregar os horários. Atualize a página.</div>`:""}${S.err&&S.t===null&&!S.own&&!S.pin?`<div class="note">${S.err}</div>`:""}<section class="sec"><h2>💖 Tabela de Preços</h2><p class="mu">Toque no serviço para agendar</p><div class="grid">`+SV.map((v,i)=>{const c=(i?"":"ft ")+(S.s===i?"sel":"");return i?`<button class="sv ${c}" data-a="s" data-i="${i}"><span class="ic">${v[0]}</span><b>${v[1]}</b><span class="pill">R$ ${v[2]}</span><small>${tm(v[3])}</small></button>`:`<button class="sv ${c}" data-a="s" data-i="0"><span class="ic">${v[0]}</span><span><b>${v[1]}</b><small>Unhas longas e perfeitas · ${tm(v[3])}</small></span><span class="pill">R$ ${v[2]}</span></button>`}).join("")+`</div></section>`;
  if(S.s!==null){
    h+=`<section class="sec" id="nx"><h2>📅 Agende</h2><p class="mu">${SV[S.s][1]} · escolha o dia</p><div class="chips">`+days().map(d=>{const f=slots(d,S.s).length;return `<button class="${S.d==d?"sel":""}" data-a="d" data-i="${d}" ${f?"":"disabled"}>${lab(d)}${f?"":" · lotado"}</button>`}).join("")+`</div>`;
    if(S.d){const l=slots(S.d,S.s);h+=`<h3>Horário</h3>`+(l.length?`<div class="chips">`+l.map(t=>`<button class="${S.t===t?"sel":""}" data-a="t" data-i="${t}">${hm(t)}</button>`).join("")+`</div>`:`<p class="mu">Sem horários livres neste dia 💕</p>`)}
    if(S.t!==null){h+=`<h3>Seus dados</h3><input id="nm" placeholder="Seu nome" value="${esc(S.n)}"><input id="ph" type="tel" placeholder="WhatsApp com DDD" value="${esc(S.p)}">${S.err?`<p class="mu" style="color:#d33">${S.err}</p>`:""}<button class="pri" data-a="go">Confirmar agendamento</button>`}
    h+=`</section>`}
  h+=`<section class="sec"><h2>📸 Meus Trabalhos</h2><p class="mu">Toque na foto para ampliar</p><div class="gal">`+G.map((s,i)=>`<img src="${s}" alt="Unhas feitas por Renata Julia" data-a="z" data-i="${i}">`).join("")+`</div></section>
  <section class="sec"><h2>📅 Como agendar</h2><div class="st"><b>1</b><span>Escolha o <strong>serviço</strong> na tabela de preços</span></div><div class="st"><b>2</b><span>Escolha o <strong>dia e o horário</strong> livre</span></div><div class="st"><b>3</b><span>Confirme e venha ficar linda! ✨</span></div></section>
  <section class="sec"><h2>🌸 Por que escolher</h2><p class="mu">Atendimento feito com carinho</p><div class="grid"><div class="why"><span>🧼</span>Higiene e cuidado</div><div class="why"><span>🎀</span>Acabamento delicado</div><div class="why"><span>💎</span>Alongamento durável</div><div class="why"><span>💬</span>Atendimento próximo</div></div></section>
  <section class="sec"><h2>📍 Onde estamos</h2><p>Rua Santos Dumont, 104<br>Extremoz – RN</p><div class="row"><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Rua%20Santos%20Dumont%20104%20Extremoz%20RN">🗺️ Abrir no mapa</a></div><p class="mu" style="margin-top:12px">💅 Renata Julia Nails Design<br>WhatsApp: (84) 99112-8014<br>@renata_julia282</p></section>
  <footer><button data-a="pin">Área da Renata</button></footer>`+(S.z!=null?`<div class="lb" data-a="zx"><img src="${G[S.z]}" alt=""></div>`:"");
  return h}
function pubView(){return `<div class="hero"><h1>Agenda 📅</h1><p>Veja os horários livres e ocupados</p></div>`+days().map(d=>`<div class="card"><b>${lab(d)}</b><div class="chips" style="margin-top:8px">`+Array.from({length:(CLOSE-OPEN)/ST},(_,k)=>OPEN+k*ST).map(t=>free(d,t,ST)?`<span class="btn ok">${hm(t)} livre</span>`:`<span class="btn" style="opacity:.45">${hm(t)} ocupado</span>`).join("")+`</div></div>`).join("")+`<button class="pri" data-a="out">Voltar e agendar</button>`}
function gcal(b){const v=SV[b.s],f=t=>b.d.replace(/-/g,"")+"T"+p2(Math.floor(t/60))+p2(t%60)+"00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(v[1]+" - Renata Julia Nails")+"&dates="+f(b.t)+"/"+f(b.t+v[3])+"&location="+encodeURIComponent("Rua Santos Dumont, 104, Extremoz RN")}
function doneView(){const b=S.done,v=SV[b.s];
  return `<div class="hero"><h1>Agendado! 🎉</h1></div><div class="card"><p class="ok">${v[0]} ${v[1]}</p><p><b>${lab(b.d)}</b> às <b>${hm(b.t)}</b><br>${esc(b.n)} · ${esc(b.p)}</p><p class="mu">Valor: R$ ${v[2]}</p>
  <div class="row"><a class="btn" target="_blank" href="${gcal(b)}">📅 Adicionar à agenda</a><a class="btn" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent("Oi Renata! Agendei "+v[1]+" dia "+lab(b.d)+" às "+hm(b.t)+" 💅")}">💬 Avisar Renata</a></div></div>
  <button class="pri" data-a="new">Novo agendamento</button>`}
function pinView(){return `<div class="hero"><h1>Área da Renata 🔒</h1></div><input id="em" type="email" placeholder="E-mail" autocomplete="username" value="${esc(S.em||"")}"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password">${S.err?`<p class="mu" style="color:#d33">${S.err}</p>`:""}<button class="pri" data-a="in">Entrar</button><div class="row"><button data-a="out">Voltar</button></div>`}
function owner(){
  let h=`<div class="hero"><h1>Painel 💅</h1></div><div class="tabs"><button class="${S.tab=="ag"?"sel":""}" data-a="tab" data-i="ag">Agenda</button><button class="${S.tab=="bl"?"sel":""}" data-a="tab" data-i="bl">Bloquear</button><button data-a="rf">↻</button><button data-a="out">Sair</button></div>`;
  if(S.err)h+=`<p class="mu" style="color:#d33">${S.err}</p>`;
  if(S.tab=="ag"){
    h+=M.b.length?M.b.map(b=>{const v=SV.find(x=>x[1]==b.servico)||["💅",b.servico,0,60],dg=b.telefone.replace(/\D/g,"");return `<div class="card"><b>${lab(b.data)} · ${hm(b.hora)}</b> ${b.pago?`<span class="ok">✔ Pago</span>`:""}<br>${v[0]} ${esc(b.servico)} · R$ ${v[2]}<br>${esc(b.nome)} · ${esc(b.telefone)}<div class="row"><a class="btn" target="_blank" href="https://wa.me/55${dg}?text=${encodeURIComponent("Oi "+b.nome+"! Seu horário está confirmado: "+lab(b.data)+" às "+hm(b.hora)+" 💅")}">💬 Confirmar</a><button data-a="pd" data-i="${b.id}">${b.pago?"Desfazer pago":"Marcar pago"}</button><button data-a="cx" data-i="${b.id}">Cancelar</button></div></div>`}).join(""):`<p class="mu">Nenhum agendamento por enquanto.</p>`}
  else{
    const ds=days();if(!S.bd)S.bd=ds[0];const dia=M.k.find(x=>x.data==S.bd&&x.hora==null);
    h+=`<div class="chips">`+ds.map(d=>`<button class="${S.bd==d?"sel":""}" data-a="bd" data-i="${d}">${lab(d)}</button>`).join("")+`</div><div class="row"><button data-a="day">${dia?"Liberar o dia todo":"Bloquear o dia todo"}</button></div><p class="mu">Toque num horário para bloquear ou liberar.</p><div class="chips">`;
    for(let t=OPEN;t<CLOSE;t+=ST){const bk=M.b.some(x=>x.data==S.bd&&t>=x.hora&&t<x.hora+x.duracao),k=M.k.some(x=>x.data==S.bd&&x.hora===t);
      h+=`<button class="${k?"sel":""}" ${bk?"disabled":""} data-a="k" data-i="${t}">${hm(t)}${bk?" 👤":k?" ✖":""}</button>`}
    h+=`</div><div class="note">👤 = cliente agendado · ✖ = bloqueado por você · atendimento das 18h às 22h.</div>`}
  return h}
async function loadOC(){try{const t=new Date(),e=new Date();e.setDate(e.getDate()+16);const r=await sb.rpc("ocupados",{de:iso(t),ate:iso(e)});if(r.error)throw r.error;OC=r.data||[];S.off=false}catch(x){S.off=true}}
async function loadOwner(){try{const n=iso(new Date());const a=await sb.from("agendamentos").select("*").eq("status","ok").gte("data",n).order("data").order("hora");const b=await sb.from("bloqueios").select("*").gte("data",n);if(a.error||b.error)throw 1;M.b=a.data;M.k=b.data;S.err=""}catch(x){S.err="Erro ao carregar. Toque em ↻."}await loadOC()}
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,i=el.dataset.i;
  if(S.busy)return;
  if($("#nm"))S.n=$("#nm").value;if($("#ph"))S.p=$("#ph").value;
  try{
    if(a=="s"){S.s=+i;S.d=null;S.t=null;S.err=""}
    else if(a=="d"){S.d=i;S.t=null;S.err=""}
    else if(a=="t"){S.t=+i;S.err=""}
    else if(a=="z")S.z=+i;
    else if(a=="zx")S.z=null;
    else if(a=="go"){
      const dg=S.p.replace(/\D/g,"");
      if(S.n.trim().length<2||dg.length<10){S.err="Preencha nome e WhatsApp com DDD.";render();return}
      if(!free(S.d,S.t,SV[S.s][3])){S.err="Esse horário acabou de ser ocupado. Escolha outro.";S.t=null;render();return}
      S.busy=true;el.disabled=true;el.textContent="Agendando...";
      const v=SV[S.s],r=await sb.from("agendamentos").insert({servico:v[1],data:S.d,hora:S.t,duracao:v[3],nome:S.n.trim(),telefone:S.p.trim()});
      if(r.error){const oc=/ocupado/.test(r.error.message||"");S.err=oc?"Esse horário acabou de ser ocupado. Escolha outro.":"Não foi possível agendar. Tente de novo.";if(oc)S.t=null}
      else{S.done={s:S.s,d:S.d,t:S.t,n:S.n.trim(),p:S.p.trim()};S.err=""}
      await loadOC()}
    else if(a=="new"){S.s=S.d=S.t=S.done=null;S.n=S.p="";S.err=""}
    else if(a=="pub"){S.pub=true;S.err="";window.scrollTo(0,0)}
    else if(a=="pin"){S.err="";const r=await sb.auth.getSession();if(r.data&&r.data.session){S.own=true;await loadOwner()}else S.pin=true}
    else if(a=="in"){const em=$("#em").value.trim(),pw=$("#pw").value;S.em=em;S.busy=true;el.disabled=true;el.textContent="Entrando...";const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)S.err="E-mail ou senha incorretos.";else{S.own=true;S.pin=false;S.err="";await loadOwner()}}
    else if(a=="out"){if(S.own)await sb.auth.signOut();S.own=S.pin=S.pub=false;S.err=""}
    else if(a=="tab")S.tab=i;
    else if(a=="rf")await loadOwner();
    else if(a=="pd"){const b=M.b.find(x=>x.id==i);await sb.from("agendamentos").update({pago:!b.pago}).eq("id",i);await loadOwner()}
    else if(a=="cx"){if(!confirm("Cancelar este agendamento?"))return;await sb.from("agendamentos").update({status:"cancelado"}).eq("id",i);await loadOwner()}
    else if(a=="bd")S.bd=i;
    else if(a=="day"){const k=M.k.find(x=>x.data==S.bd&&x.hora==null);if(k)await sb.from("bloqueios").delete().eq("id",k.id);else await sb.from("bloqueios").insert({data:S.bd});await loadOwner()}
    else if(a=="k"){const t=+i,k=M.k.find(x=>x.data==S.bd&&x.hora===t);if(k)await sb.from("bloqueios").delete().eq("id",k.id);else await sb.from("bloqueios").insert({data:S.bd,hora:t});await loadOwner()}
  }catch(x){S.err="Algo deu errado. Tente de novo."}
  S.busy=false;render();
  if(a=="s"){const n=$("#nx");if(n)n.scrollIntoView({behavior:"smooth",block:"start"})}
});
const typing=()=>{const f=document.activeElement;return f&&f.tagName=="INPUT"};
render();loadOC().then(()=>{if(!typing())render()});
setInterval(async()=>{if(S.busy||S.pin||S.done)return;if(S.own){await loadOwner();render();return}await loadOC();if(!typing())render()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!S.own&&!S.done&&!S.busy)loadOC().then(()=>{if(!typing())render()})});
</script></body></html>
